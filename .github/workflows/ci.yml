name: ci

# Every push: the figures (hdd/check.mjs), the root language choice, the site build (one page per language, each
# under 1 MB), and a check that the CSP in dist/_headers matches the inline script of every page. Branches stop
# there. Deploy: `wrangler deploy` on a push to main (or a manual run on main, for the first deploy), and only once
# the repository variable PUBLIC_RELEASE is "true" (the owner's Go on the first public release sets it). The
# Cloudflare token comes from the algotitanhq organization (secret CLOUDFLARE_API_TOKEN); never add a
# repository-level copy. No step reads the variable CLOUDFLARE_ACCOUNT_ID: a value from `vars` would show in clear in
# the logs. The Deploy step asks Cloudflare for the token's single account and masks its ID, as Uberblok's does.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  WRANGLER_VERSION: "4.142.0"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Check the figures and the root language choice
        run: npm run check
      - name: Build
        run: npm run build
      - name: Check the CSP against the inline script of every page
        run: |
          for f in dist/*/index.html; do
            h=$(python3 -c "import re,sys,hashlib,base64;s=open(sys.argv[1]).read();m=re.search(r'<script type=\"module\">(.*?)</script>',s,re.S);print(base64.b64encode(hashlib.sha256(m.group(1).encode()).digest()).decode())" "$f")
            grep -q "'sha256-$h'" dist/_headers || { echo "::error::$f: inline script not allowed by dist/_headers"; exit 1; }
          done
      - name: Deploy
        if: vars.PUBLIC_RELEASE == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::The secret CLOUDFLARE_API_TOKEN is not visible to this repository"
            exit 1
          fi
          if ! accounts="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/accounts)"; then
            echo "::error::Cloudflare did not answer the account lookup"
            exit 1
          fi
          account="$(echo "$accounts" | jq -r 'if .success and (.result | length) == 1 and (.result[0].id | type) == "string" then .result[0].id else empty end')"
          if [ -z "$account" ]; then
            echo "::error::The token does not see exactly one Cloudflare account"
            exit 1
          fi
          echo "::add-mask::$account"
          export CLOUDFLARE_ACCOUNT_ID="$account"
          message="$(git log -1 --format=%s | head -c 100)"
          npx --yes "wrangler@${WRANGLER_VERSION}" deploy --message "$message"
